<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSL Manager - 登录</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h1>SSL Manager</h1>
            <h2>登录</h2>
            <div class="tab-group">
                <button class="tab active" data-tab="admin-login">管理员登录</button>
                <button class="tab" data-tab="readonly-login">只读登录</button>
            </div>
            <div id="admin-login" class="tab-content active">
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" required placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" required placeholder="请输入密码">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">登录</button>
                </form>
            </div>
            <div id="readonly-login" class="tab-content" style="display:none;">
                <form id="readonly-login-form">
                    <div class="form-group">
                        <label for="readonly-password">只读密码</label>
                        <input type="password" id="readonly-password" name="password" required placeholder="请输入只读密码">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">只读登录</button>
                </form>
            </div>
            <div id="login-error" class="error-message" style="display:none;"></div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>
